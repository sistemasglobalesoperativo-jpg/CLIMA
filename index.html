<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sistemas Globales | Cartagena al Día</title>
<style>
:root{
  --navy:#03163f;--blue:#073d91;--red:#e30613;--green:#00833f;
  --white:#fff;--soft:#eef2f7;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03163f}
body{
  font-family:Arial,Helvetica,sans-serif;color:#fff;
}
.app{
  width:1920px;height:1080px;padding:12px 16px;
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  transform-origin:center center;
  display:grid;grid-template-rows:26% 68% 6%;
  background:
    radial-gradient(circle at 40% 5%,rgba(255,255,255,.08),transparent 28%),
    linear-gradient(135deg,#071b4b 0%,#03143a 60%,#00102f 100%);
}
.header{
  display:grid;grid-template-columns:49% 51%;align-items:stretch;
  background:linear-gradient(100deg,#fff 0%,#fff 34%,#d9dfea 48%,#071b4b 75%,#03163f 100%);
  border-radius:0 0 18px 18px;overflow:hidden;
}
.logoWrap{display:flex;align-items:center;padding:12px 38px;background:#fff}
.logo{
  width:min(438px,620px);height:222px;object-fit:contain;object-position:left center;
}
.clockWrap{
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:10px 28px;
}
.clockIcon{
  width:100px;height:100px;min-width:72px;min-height:72px;border:4px solid #fff;
  border-radius:50%;position:relative;
}
.clockIcon:before{content:"";position:absolute;left:50%;top:50%;width:3px;height:34%;
  background:#fff;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg)}
.clockIcon:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:28%;
  background:#fff;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(125deg)}
.clockText{text-align:left;line-height:.95}
.time{font-size:clamp(42px,5.8vw,104px);font-weight:900;white-space:nowrap}
.ampm{font-size:clamp(20px,38px,36px);font-weight:700;margin-left:.4vw}
.date{font-size:clamp(18px,38px,35px);font-weight:700;margin-top:13px;white-space:nowrap}
.cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  padding:17px 25px 0;
}
.card{
  border-radius:25px;padding:2.22px 29px;display:flex;flex-direction:column;
  align-items:center;text-align:center;overflow:hidden;border:2px solid;
}
.weather{background:linear-gradient(150deg,#073f98,#042d78);border-color:#1682ff}
.pico{background:linear-gradient(150deg,#f00d18,#bf0008);border-color:#ff2a2a}
.dolar{background:linear-gradient(150deg,#008b44,#00652f);border-color:#00b95a}
.title{font-size:clamp(42px,43px,42px);font-weight:900;margin:0;line-height:1.05}
.subtitle{font-size:clamp(27px,28px,27px);font-weight:800;margin-top:.9vh}
.weatherIcon{height:194px;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,135px,135px)}
.temp{font-size:clamp(65px,8.38px,145px);font-weight:900;line-height:.9}
.condition{font-size:clamp(18px,32px,31px);font-weight:700;margin-top:13px}
.carIcon{font-size:clamp(58px,5vw,95px);margin-top:15px}
.today{font-size:clamp(20px,38px,36px);font-weight:900;margin-top:.7vh}
.plates{
  background:#f8f8f8;color:#c60009;border-radius:17px;width:82%;
  padding:.4vh .6vw;font-size:clamp(48px,6vw,110px);font-weight:900;
  margin:.9vh 0;
}
.category{font-size:clamp(18px,32px,31px);font-weight:900}
.line{width:82%;height:2px;background:rgba(255,255,255,.9);margin:1vh 0}
.hours{font-size:clamp(18px,30px,29px);font-weight:800;line-height:1.35}
.moneyIcon{
  margin-top:15px;width:8.5vh;height:8.5vh;border-radius:50%;
  background:#fff;color:#007638;display:flex;align-items:center;justify-content:center;
  font-size:clamp(48px,5vw,88px);font-weight:900;
}
.usd{font-size:clamp(21px,38px,36px);font-weight:800;margin-top:22px}
.value{font-size:clamp(45px,5.38px,94px);font-weight:900;line-height:1;margin-top:1vh;white-space:nowrap}
.cop{font-size:clamp(22px,40px,38px);font-weight:900;margin-top:.5vh}
.update{
  margin-top:auto;margin-bottom:.5vh;width:90%;padding:1vh .8vw;border-radius:18px;
  background:rgba(0,0,0,.22);font-size:clamp(14px,24px,42px);font-weight:700;
}
.footer{
  display:flex;align-items:center;justify-content:center;gap:.135px;
  font-size:clamp(14px,24px,42px);color:#d8deeb;font-weight:600;
}
.sync{font-size:1.3em}

</style>
</head>

    <div class="clockWrap">
      <div class="clockIcon"></div>
      <div class="clockText">
        <div><span id="time" class="time">--:--:--</span><span id="ampm" class="ampm"></span></div>
        <div id="date" class="date">--</div>
      </div>
    </div>
  </header>

  <main class="cards">
    <section class="card weather">
      <h2 class="title">CLIMA EN CARTAGENA</h2>
      <div id="weatherIcon" class="weatherIcon">🌤️</div>
      <div id="temp" class="temp">--°C</div>
      <div id="condition" class="condition">Consultando clima...</div>
    </section>

    <section class="card pico">
      <h2 class="title">PICO Y PLACA</h2>
      <div class="subtitle">CARTAGENA</div>
      <div class="carIcon">🚗</div>
      <div class="today">HOY</div>
      <div id="plates" class="plates">--</div>
      <div id="category" class="category">PARTICULARES</div>
      <div class="line"></div>
      <div id="hours" class="hours">Consultando...</div>
    </section>

    <section class="card dolar">
      <h2 class="title">DÓLAR (TRM)</h2>
      <div class="subtitle">TASA REPRESENTATIVA DEL MERCADO</div>
      <div class="moneyIcon">$</div>
      <div class="usd">1 USD =</div>
      <div id="value" class="value">$ --</div>
      <div class="cop">COP</div>
      <div id="update" class="update">↻ Actualizando...</div>
    </section>
  </main>

  <footer class="footer"><span class="sync">⟳</span> Información actualizada automáticamente</footer>
</div>

<script>
const TZ='America/Bogota';
const LAT=10.3910, LON=-75.4794;

const PERIODOS=[
 {inicio:'2026-01-16',fin:'2026-03-27',dias:['5 y 6','7 y 8','9 y 0','1 y 2','3 y 4']},
 {inicio:'2026-03-30',fin:'2026-06-27',dias:['7 y 8','9 y 0','1 y 2','3 y 4','5 y 6']},
 {inicio:'2026-06-30',fin:'2026-10-02',dias:['9 y 0','1 y 2','3 y 4','5 y 6','7 y 8']},
 {inicio:'2026-10-05',fin:'2027-01-22',dias:['1 y 2','3 y 4','5 y 6','7 y 8','9 y 0']}
];
const FESTIVOS=new Set([
 '2026-01-01','2026-01-12','2026-03-23','2026-04-02','2026-04-03',
 '2026-05-01','2026-05-18','2026-06-08','2026-06-15','2026-06-29',
 '2026-07-20','2026-08-07','2026-08-17','2026-10-12','2026-11-02',
 '2026-11-16','2026-12-08','2026-12-25','2027-01-01','2027-01-11'
]);

const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}

function nowParts(){
 const p=new Intl.DateTimeFormat('en-CA',{
  timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
 }).formatToParts(new Date());
 return Object.fromEntries(p.map(x=>[x.type,x.value]));
}
function clock(){
 const n=nowParts();
 let h=Number(n.hour);
 const ap=h>=12?'p. m.':'a. m.';
 h=h%12||12;
 $('time').textContent=pad(h)+':'+n.minute+':'+n.second;
 $('ampm').textContent=ap;
 const d=new Date(`${n.year}-${n.month}-${n.day}T12:00:00`);
 $('date').textContent=new Intl.DateTimeFormat('es-CO',{
  weekday:'long',day:'numeric',month:'long',year:'numeric'
 }).format(d);
}
setInterval(clock,1000);clock();

function weatherIcon(code){
 if(code===0)return ['☀️','Despejado'];
 if([1,2].includes(code))return ['🌤️','Parcialmente nublado'];
 if(code===3)return ['☁️','Nublado'];
 if([45,48].includes(code))return ['🌫️','Neblina'];
 if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return ['🌧️','Lluvia'];
 if([95,96,99].includes(code))return ['⛈️','Tormenta'];
 return ['🌤️','Condiciones variables'];
}

async function updateWeather(){
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=${encodeURIComponent(TZ)}&temperature_unit=celsius`;
  const r=await fetch(u,{cache:'no-store'}); if(!r.ok)throw Error();
  const j=await r.json(), [icon,text]=weatherIcon(Number(j.current.weather_code));
  $('weatherIcon').textContent=icon;
  $('temp').textContent=Math.round(j.current.temperature_2m)+'°C';
  $('condition').textContent=text;
 }catch(e){
  $('condition').textContent='Clima temporalmente no disponible';
 }
}

function updatePico(){
 const n=nowParts();
 const iso=`${n.year}-${n.month}-${n.day}`;
 const d=new Date(iso+'T12:00:00');
 const day=d.getDay();
 if(day===0||day===6||FESTIVOS.has(iso)){
  $('plates').textContent='SIN RESTRICCIÓN';
  $('category').textContent='PARTICULARES';
  $('hours').textContent='Hoy no aplica';
  return;
 }
 const p=PERIODOS.find(x=>iso>=x.inicio&&iso<=x.fin);
 if(!p){$('plates').textContent='CONSULTAR';$('hours').textContent='Rotación no configurada';return}
 $('plates').textContent=p.dias[day-1];
 $('category').textContent='PARTICULARES';
 $('hours').innerHTML='7:00–9:00 a. m.<br>6:00–8:00 p. m.';
}

async function updateDollar(){
 try{
  const r=await fetch('https://co.dolarapi.com/v1/trm?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error();
  const j=await r.json();
  $('value').textContent='$'+Number(j.valor).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('update').textContent='↻ Actualizado: '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
 }catch(e){
  $('update').textContent='↻ TRM temporalmente no disponible';
 }
}

async function refresh(){
 updatePico();
 await Promise.allSettled([updateWeather(),updateDollar()]);
}
refresh();
setInterval(refresh,5*60*1000);
setInterval(updatePico,60*1000);

/* Canvas real: 1920x1080. En pantallas con otra resolución se escala proporcionalmente. */
function scaleCanvas(){
  const app=document.querySelector('.app');
  const scale=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  app.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize',scaleCanvas);
scaleCanvas();
</script>
