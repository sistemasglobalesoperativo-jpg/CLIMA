<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sistemas Globales Cartagena · Panel Rotativo</title>
<style>
*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* =========================================================
   V6 — VNNOX / VPLAYER: LIENZO REALMENTE RESPONSIVO
   No se usa transform:scale() ni un canvas fijo de 1920x1080.
   El propio documento ocupa exactamente el viewport que VNNOX
   entrega al navegador. Esto evita que el contenido quede en
   una miniatura dentro de la pantalla.
   ========================================================= */
body{
  width:100vw;
  height:100vh;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:#000;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  margin:0;
  overflow:hidden;
  background:#000;
  transform:none !important;
  -webkit-transform:none !important;
}

/* ── Cabecera ───────────────────────────────────────────── */
.head{
  position:relative;
  width:100%;
  height:15.74vh;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:2.08vw;
  padding:0 3.65vw;
  overflow:hidden;
}

.head img{
  width:auto;
  height:clamp(36px, 5.83vw, 112px);
  max-width:620px;
  object-fit:contain;
  display:block;
  flex:none;
  animation:baja 1s cubic-bezier(.2,.8,.2,1) both;
}

.clock{
  display:flex;
  align-items:baseline;
  gap:18px;
  flex:none;
  animation:baja 1s cubic-bezier(.2,.8,.2,1) .12s both;
}

.clock .t{
  font-size:clamp(28px, 4.79vw, 92px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:.9;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.clock .ap{
  font-size:clamp(12px, 1.56vw, 30px);
  font-weight:700;
  color:rgba(255,255,255,.6);
  white-space:nowrap;
}

.clock .d{
  font-size:clamp(11px, 1.46vw, 28px);
  font-weight:500;
  color:rgba(255,255,255,.5);
  white-space:nowrap;
  margin-left:18px;
}

.tricolor{
  position:absolute;
  left:3.65vw;
  right:3.65vw;
  bottom:0;
  height:4px;
  opacity:.9;
  background:linear-gradient(
    90deg,
    #5B9BFF 0 33.34%,
    #FF6A5E 33.34% 66.67%,
    #48D98A 66.67% 100%
  );
}

/* ── Escenario ──────────────────────────────────────────── */
#stage{
  width:100%;
  height:84.26vh;
  position:relative;
  overflow:hidden;
}

.panel{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:30% 70%;
  align-items:center;
  gap:0;
  padding:0 4.95vw;
  overflow:hidden;
  animation:entra .85s cubic-bezier(.2,.85,.2,1) both;
}

.panel.b{background:#0E2A63}
.panel.r{background:#8E1610}
.panel.g{background:#0A5730}

.panel .glow{
  position:absolute;
  top:-30%;
  left:3%;
  width:58%;
  height:130%;
  pointer-events:none;
}

.panel.b .glow{
  background:radial-gradient(
    circle,
    rgba(91,155,255,.55) 0%,
    rgba(91,155,255,0) 66%
  );
}

.panel.r .glow{
  background:radial-gradient(
    circle,
    rgba(255,106,94,.5) 0%,
    rgba(255,106,94,0) 66%
  );
}

.panel.g .glow{
  background:radial-gradient(
    circle,
    rgba(72,217,138,.45) 0%,
    rgba(72,217,138,0) 66%
  );
}

/* ── Ilustración izquierda ──────────────────────────────── */
.art{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  animation:icono 1s cubic-bezier(.2,.85,.2,1) .1s both;
}

.art > *{
  animation:flota 6.5s ease-in-out infinite;
}

.art svg{
  width:20.31vw !important;
  height:20.31vw !important;
  display:block;
}

.coin{
  width:17.19vw;
  height:17.19vw;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11.72vw;
  font-weight:700;
  color:#0A5730;
  line-height:1;
  box-shadow:0 0 60px rgba(255,255,255,.08);
}

/* ── Información derecha ────────────────────────────────── */
.body{
  position:relative;
  width:100%;
  min-width:0;
  padding-left:1.82vw;
  z-index:2;
  animation:sube .9s cubic-bezier(.2,.85,.2,1) .18s both;
}

.kicker{
  font-size:clamp(16px, 2.5vw, 48px);
  font-weight:700;
  letter-spacing:.18em;
  color:rgba(255,255,255,.78);
  line-height:1.05;
  white-space:nowrap;
}

.rule{
  height:0.42vw;
  border-radius:4px;
  width:9.9vw;
  margin:1.56vw 0;
}

.panel.b .rule{background:#5B9BFF}
.panel.r .rule{background:#FF6A5E}
.panel.g .rule{background:#48D98A}

.mega{
  font-size:clamp(70px, 14.84vw, 285px);
  font-weight:700;
  letter-spacing:-.055em;
  line-height:.82;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  margin-top:15px;
}

.note{
  font-size:clamp(18px, 3.23vw, 62px);
  font-weight:500;
  line-height:1.12;
  white-space:nowrap;
}

/* ── Pico y placa ───────────────────────────────────────── */
.plate{
  display:inline-block;
  position:relative;
  overflow:hidden;
  background:#fff;
  border-radius:1.35vw;
  padding:0.63vw 3.02vw;
  margin-top:1.15vw;
}

.plate i{
  position:absolute;
  top:0;
  bottom:0;
  width:26%;
  animation:barrido 3.4s ease-in-out infinite;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(142,22,16,.16) 50%,
    rgba(255,255,255,0) 100%
  );
}

.plate b{
  position:relative;
  display:block;
  font-size:clamp(65px, 13.02vw, 250px);
  font-weight:700;
  color:#8E1610;
  letter-spacing:.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.free{
  display:inline-flex;
  align-items:center;
  gap:1.46vw;
  background:#fff;
  border-radius:1.35vw;
  padding:1.56vw 3.02vw;
  margin-top:1.15vw;
  font-size:clamp(28px, 4.95vw, 95px);
  font-weight:700;
  color:#0C6B33;
  line-height:1;
  white-space:nowrap;
}

.free svg{
  width:4.43vw !important;
  height:4.43vw !important;
}

/* ── TRM ────────────────────────────────────────────────── */
.trm{
  font-size:clamp(65px, 13.28vw, 255px);
  font-weight:700;
  letter-spacing:-.055em;
  line-height:.88;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  margin-top:15px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:1.25vw;
  background:rgba(0,0,0,.30);
  border-radius:20px;
  padding:1.25vw 1.67vw;
}

.chip .a{
  font-size:clamp(18px, 3.23vw, 62px);
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}

.chip .v{
  font-size:clamp(18px, 3.02vw, 58px);
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
}

/* ── Indicadores ────────────────────────────────────────── */
.dots{
  position:absolute;
  left:0;
  right:0;
  bottom:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1.25vw;
  pointer-events:none;
  z-index:3;
}

.dots i{
  height:0.94vw;
  width:0.94vw;
  border-radius:999px;
  background:#fff;
  opacity:.35;
  transition:width .5s ease,opacity .5s ease;
}

.dots i.on{
  width:4.06vw;
  opacity:1;
}

/* ── Animaciones ────────────────────────────────────────── */
@keyframes entra{
  from{
    opacity:0;
    transform:translateX(150px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes sube{
  from{
    opacity:0;
    transform:translateY(55px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes icono{
  from{
    opacity:0;
    transform:translateX(-80px) scale(.82);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
  }
}

@keyframes flota{
  0%,100%{transform:translateY(-10px)}
  50%{transform:translateY(10px)}
}

@keyframes baja{
  from{
    opacity:0;
    transform:translateY(-30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes barrido{
  0%{transform:translateX(-130%)}
  100%{transform:translateX(420%)}
}



/* =========================================================
   V7 — AJUSTE FINAL PARA VNNOX / PANTALLAS MUY ANCHAS
   En V6 el contenedor ya ocupa todo el viewport.
   El problema restante era que tipografías/elementos estaban
   calculados principalmente con vw; en un viewport muy ancho
   crecían demasiado y se cortaban verticalmente.
   V7 usa la altura (vh) para escalar el contenido, manteniendo
   el ancho al 100% y evitando recortes.
   ========================================================= */
html, body, #app{
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
}

.head{
  height:15.74vh;
  padding:0 3.65%;
  gap:2%;
}

.head img{
  height:10.37vh;
  max-height:112px;
  max-width:32vw;
}

.clock{
  gap:1.67vh;
}

.clock .t{
  font-size:8.52vh;
}

.clock .ap{
  font-size:2.78vh;
}

.clock .d{
  font-size:2.59vh;
  margin-left:1.67vh;
}

.tricolor{
  left:3.65%;
  right:3.65%;
  height:4px;
}

#stage{
  height:84.26vh;
}

.panel{
  /* Compatibilidad VNNOX / WebView antiguo: no usar inset */
  top:0;
  right:0;
  bottom:0;
  left:0;
  width:100%;
  height:100%;
  padding:0 4.95%;
}

.art svg{
  width:36.11vh !important;
  height:36.11vh !important;
}

.coin{
  width:30.56vh;
  height:30.56vh;
  font-size:20.83vh;
}

.body{
  padding-left:1.82%;
}

.kicker{
  font-size:4.44vh;
}

.rule{
  height:.74vh;
  width:9.9vh;
  margin:2.78vh 0;
}

.mega{
  font-size:26.39vh;
  margin-top:1.39vh;
}

.note{
  font-size:5.74vh;
}

.plate{
  border-radius:2.41vh;
  padding:1.11vh 3.02vh;
  margin-top:2.04vh;
}

.plate b{
  font-size:23.15vh;
}

.free{
  gap:2.59vh;
  border-radius:2.41vh;
  padding:2.78vh 5.37vh;
  margin-top:2.04vh;
  font-size:8.8vh;
}

.free svg{
  width:7.87vh !important;
  height:7.87vh !important;
}

.trm{
  font-size:23.61vh;
  margin-top:1.39vh;
}

.chip{
  gap:2.22vh;
  border-radius:1.85vh;
  padding:2.22vh 2.96vh;
}

.chip .a{
  font-size:5.74vh;
}

.chip .v{
  font-size:5.37vh;
}

.dots{
  bottom:2.59vh;
  gap:2.22vh;
}

.dots i{
  height:1.67vh;
  width:1.67vh;
}

.dots i.on{
  width:7.22vh;
}

</style>
</head>

    {ini:'2026-03-30', fin:'2026-06-27', dias:['7 y 8','9 y 0','1 y 2','3 y 4','5 y 6']},
    {ini:'2026-06-30', fin:'2026-10-02', dias:['9 y 0','1 y 2','3 y 4','5 y 6','7 y 8']},
    {ini:'2026-10-05', fin:'2027-01-22', dias:['1 y 2','3 y 4','5 y 6','7 y 8','9 y 0']}
  ];

  var PERIODOS_24H = [
    ['2026-03-27','2026-04-07'],
    ['2026-06-12','2026-08-07'],
    ['2026-12-11','2027-01-22']
  ];

  /* Festivos colombianos dentro de la vigencia del decreto. */
  var FESTIVOS = {
    '2026-01-01':1,'2026-01-12':1,'2026-03-23':1,'2026-04-02':1,'2026-04-03':1,
    '2026-05-01':1,'2026-05-18':1,'2026-06-08':1,'2026-06-15':1,'2026-06-29':1,
    '2026-07-20':1,'2026-08-07':1,'2026-08-17':1,'2026-10-12':1,'2026-11-02':1,
    '2026-11-16':1,'2026-12-08':1,'2026-12-25':1,
    '2027-01-01':1,'2027-01-11':1
  };

  function fechaColombia(){
    try {
      return new Date(new Date().toLocaleString('en-US', {
        timeZone:'America/Bogota'
      }));
    } catch(e) {
      return new Date();
    }
  }

  function fechaISO(d){
    return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
  }

  function esFestivo(d){
    return !!FESTIVOS[fechaISO(d)];
  }

  function enPeriodo(fecha, periodos){
    for (var k=0; k<periodos.length; k++){
      if (fecha >= periodos[k][0] && fecha <= periodos[k][1]) return true;
    }
    return false;
  }

  function picoPlacaCartagena(){
    var d = fechaColombia();
    var iso = fechaISO(d);
    var dia = d.getDay(); // 0 domingo, 1 lunes ... 6 sábado

    /* Fin de semana o festivo: circulación libre. */
    if (dia === 0 || dia === 6 || esFestivo(d)){
      return {
        dig:null,
        libre:true,
        especial:false,
        texto:'Circulación libre todo el día'
      };
    }

    /* Temporada especial: mantiene los mismos dígitos,
       pero la restricción es continua 24 horas. */
    var especial24 = enPeriodo(iso, PERIODOS_24H);

    for (var r=0; r<ROTACIONES_PYP.length; r++){
      var rot = ROTACIONES_PYP[r];
      if (iso >= rot.ini && iso <= rot.fin){
        var dig = rot.dias[dia-1];
        return {
          dig:dig,
          libre:false,
          especial:especial24,
          texto:especial24
            ? 'Restricción de 6:00 a. m. a 6:00 a. m. del día siguiente'
            : '7:00–9:00 a. m. · 6:00–8:00 p. m.'
        };
      }
    }

    return {
      dig:null,
      libre:true,
      especial:false,
      texto:'Sin restricción programada'
    };
  }

  /* ═════════════════════════════════════════════ */
  var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  function $(id){ return document.getElementById(id); }
  function miles(n, dec){
    var s = Number(n).toFixed(dec).split('.');
    return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (s[1] ? ',' + s[1] : '');
  }

  var datos = { clima: null, trm: null };

  /* ── Reloj ── */
  function reloj(){
    var d = new Date(), h = d.getHours(), h12 = h % 12 || 12;
    $('hora').textContent  = p2(h12) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    $('ampm').textContent  = h < 12 ? 'a. m.' : 'p. m.';
    $('fecha').textContent = DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' +
                             MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }
  reloj();
  setInterval(reloj, 1000);

  /* ── Íconos de clima: SVG en el propio archivo, nada externo ── */
  var RAYOS = '<g stroke="#FFC93C" stroke-width="7" stroke-linecap="round">' +
    '<line x1="50" y1="16" x2="50" y2="6"/><line x1="50" y1="94" x2="50" y2="84"/>' +
    '<line x1="16" y1="50" x2="6" y2="50"/><line x1="94" y1="50" x2="84" y2="50"/>' +
    '<line x1="26" y1="26" x2="19" y2="19"/><line x1="81" y1="81" x2="74" y2="74"/>' +
    '<line x1="74" y1="26" x2="81" y2="19"/><line x1="19" y1="81" x2="26" y2="74"/></g>';
  var GR = 'width:min(22vw,44vh);height:min(20vw,40vh);display:block';
  var CI = 'width:min(20vw,42vh);height:min(20vw,42vh);display:block';

  var ICONOS = {
    sol: '<svg viewBox="0 0 100 100" style="' + CI + '">' +
      '<circle cx="50" cy="50" r="21" fill="#FFC93C"/>' + RAYOS + '</svg>',
    solNubes: '<svg viewBox="0 0 110 100" style="' + GR + '">' +
      '<circle cx="38" cy="34" r="19" fill="#FFC93C"/>' +
      '<g stroke="#FFC93C" stroke-width="6" stroke-linecap="round">' +
      '<line x1="38" y1="6" x2="38" y2="0"/><line x1="10" y1="34" x2="4" y2="34"/>' +
      '<line x1="19" y1="15" x2="14" y2="10"/><line x1="57" y1="15" x2="62" y2="10"/></g>' +
      '<path d="M34 84h44a16 16 0 0 0 1-32 21 21 0 0 0-39-7 15 15 0 0 0-6 39z" fill="#fff"/></svg>',
    lluvia: '<svg viewBox="0 0 110 100" style="' + GR + '">' +
      '<path d="M30 66h48a17 17 0 0 0 1-34 22 22 0 0 0-41-7 16 16 0 0 0-8 41z" fill="#fff"/>' +
      '<g stroke="#7FC4FF" stroke-width="7" stroke-linecap="round">' +
      '<line x1="40" y1="76" x2="34" y2="94"/><line x1="58" y1="76" x2="52" y2="94"/>' +
      '<line x1="76" y1="76" x2="70" y2="94"/></g></svg>',
    noche: '<svg viewBox="0 0 100 100" style="' + CI + '">' +
      '<path d="M62 20a30 30 0 1 0 16 52 25 25 0 0 1-16-52z" fill="#E8EEFF"/>' +
      '<circle cx="80" cy="30" r="3.4" fill="#E8EEFF"/><circle cx="88" cy="48" r="2.6" fill="#E8EEFF"/></svg>'
  };
  var CARRO = '<svg viewBox="0 0 120 62" style="width:min(20vw,40vh);height:auto;display:block">' +
    '<path d="M8 44h104v-8c0-5-3-8-8-9l-14-2-9-11c-2-3-5-4-8-4H49c-3 0-6 1-8 4l-9 11-14 2c-5 1-8 4-8 9v8z" fill="rgba(255,255,255,.94)"/>' +
    '<path d="M44 25h32l6 9H38z" fill="#8E1610" opacity=".55"/>' +
    '<circle cx="30" cy="48" r="9" fill="rgba(255,255,255,.94)"/>' +
    '<circle cx="90" cy="48" r="9" fill="rgba(255,255,255,.94)"/>' +
    '<circle cx="30" cy="48" r="4" fill="#8E1610"/><circle cx="90" cy="48" r="4" fill="#8E1610"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" style="width:min(5vw,10vh);height:min(5vw,10vh);display:block;flex:none">' +
    '<path d="M9.6 17.6 4.4 12.4l1.7-1.7 3.5 3.5 8-8 1.7 1.7z" fill="#0C6B33"/></svg>';

  function claseClima(code, esDia){
    if (!esDia) return 'noche';
    if (code === 0 || code === 1) return 'sol';
    if (code >= 51) return 'lluvia';
    return 'solNubes';
  }
  function textoClima(code){
    if (code === 0) return 'Cielo despejado';
    if (code <= 2)  return 'Parcialmente nublado';
    if (code === 3) return 'Nublado';
    if (code === 45 || code === 48) return 'Neblina';
    if (code >= 95) return 'Tormenta eléctrica';
    if (code >= 80) return 'Chubascos';
    if (code >= 51) return 'Lluvia';
    return 'Parcialmente nublado';
  }

  /* ── Los tres paneles ── */
  function panelClima(){
    var c = datos.clima;
    var ico = ICONOS[c ? claseClima(c.weather_code, c.is_day === 1) : 'solNubes'];
    return '<div class="panel b"><div class="glow"></div>' +
      '<div class="art">' + ico + '</div>' +
      '<div class="body">' +
        '<div class="kicker">CLIMA EN CARTAGENA</div>' +
        '<div class="mega">' + (c ? Math.round(c.temperature_2m) + '°C' : '&mdash;') + '</div>' +
        '<div class="rule"></div>' +
        '<div class="note">' + (c ? textoClima(c.weather_code) : 'Esperando datos') + '</div>' +
      '</div></div>';
  }

  function panelPYP(){
    var p = picoPlacaCartagena();
    var caja = p.dig
      ? '<div class="plate"><i></i><b>' + p.dig + '</b></div>'
      : '<div class="free">' + CHECK + 'LIBRE</div>';

    var titulo;
    if (p.dig){
      titulo = p.especial
        ? 'HOY NO CIRCULAN · 24 HORAS'
        : 'HOY NO CIRCULAN';
    } else {
      titulo = 'HOY CIRCULAN TODOS';
    }

    return '<div class="panel r"><div class="glow"></div>' +
      '<div class="art">' + CARRO + '</div>' +
      '<div class="body">' +
        '<div class="kicker">PICO Y PLACA · ' + titulo + '</div>' +
        caja +
        '<div class="rule"></div>' +
        '<div class="note">' + p.texto + '</div>' +
      '</div></div>';
  }

  function panelTRM(){
    var t = datos.trm, cuerpo;
    if (t) {
      var sube = t.variacion >= 0;
      cuerpo = '<div class="trm">$' + miles(t.valor, 2) + '</div><div class="rule"></div>' +
        '<div class="chip"><span class="a">' + (sube ? '▲' : '▼') + '</span>' +
        '<span class="v">' + (sube ? '+' : '−') + miles(Math.abs(t.variacion), 2) +
        ' (' + miles(Math.abs(t.variacionPct), 2) + '%)</span></div>';
    } else {
      cuerpo = '<div class="trm">&mdash;</div><div class="rule"></div>' +
        '<div class="chip"><span class="v">Esperando datos</span></div>';
    }
    return '<div class="panel g"><div class="glow"></div>' +
      '<div class="art"><div class="coin">$</div></div>' +
      '<div class="body"><div class="kicker">DÓLAR HOY &middot; TRM OFICIAL</div>' + cuerpo + '</div></div>';
  }

  /* ── Rotación: se reemplaza el panel para que la animación de
        entrada vuelva a correr en cada cambio. ── */
  var PANELES = [panelClima, panelPYP, panelTRM];
  var i = 0;
  var stage = $('stage');
  var dots = [$('d0'), $('d1'), $('d2')];

  function pintar(){
    var previo = stage.querySelector('.panel');
    if (previo) previo.remove();
    stage.insertAdjacentHTML('afterbegin', PANELES[i]());
    for (var n = 0; n < 3; n++) dots[n].className = (n === i ? 'on' : '');
  }
  function rotar(){
    i = (i + 1) % PANELES.length;
    pintar();
  }
  pintar();
  setInterval(rotar, SEGUNDOS_PANEL * 1000);

  /* Re-pintar el panel si cambia el día/rotación mientras VNNOX está encendido. */
  setInterval(function(){
    if (i === 1) pintar();
  }, 60 * 1000);

  /* ── Fuentes de datos: cada una falla por separado ── */
  function cargarClima(){
    /*
     * Open-Meteo:
     * - temperatura actual a 2 m
     * - código meteorológico WMO
     * - día/noche
     * - zona horaria de Cartagena
     *
     * Se agrega un parámetro de tiempo para evitar que un reproductor
     * de señalización reutilice una respuesta HTTP antigua.
     */
    var cacheBust = '&_=' + Date.now();
    var url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude=' + LAT +
      '&longitude=' + LON +
      '&current=temperature_2m,weather_code,is_day' +
      '&timezone=America%2FBogota' +
      '&temperature_unit=celsius' +
      cacheBust;

    return fetch(url, {
      method:'GET',
      cache:'no-store',
      headers:{'Accept':'application/json'}
    })
    .then(function (r){
      if (!r.ok) throw new Error('Open-Meteo HTTP ' + r.status);
      return r.json();
    })
    .then(function (j){
      if (!j || !j.current ||
          typeof j.current.temperature_2m !== 'number' ||
          typeof j.current.weather_code !== 'number') {
        throw new Error('Respuesta de clima incompleta');
      }

      datos.clima = j.current;

      /*
       * Si el panel de clima está visible, se actualiza inmediatamente.
       * No esperamos a que termine otra rotación de 5 segundos.
       */
      if (typeof i !== 'undefined' && i === 0 &&
          typeof pintar === 'function') {
        pintar();
      }

      return j.current;
    });
  }
  function cargarTRM(){
    return fetch('https://www.datos.gov.co/resource/32sa-8pi3.json?$order=vigenciadesde%20DESC&$limit=2',
        { cache: 'no-store' })
      .then(function (r){ return r.json(); })
      .then(function (f){
        var v = parseFloat(f[0].valor), p = parseFloat(f[1].valor);
        datos.trm = { valor: v, variacion: v - p, variacionPct: ((v - p) / p) * 100 };
      });
  }
  function refrescar(){
    cargarClima().catch(function(){});
    cargarTRM().catch(function(){});
  }
  refrescar();
  setInterval(refrescar, REFRESCO_MIN * 60000);
  /* Reinicio de respaldo para reproductores que permanezcan encendidos durante días. */
  setTimeout(function(){ location.reload(); }, RECARGA_MIN * 60000);
})();
</script>
