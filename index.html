<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Expires" content="0">
<title>Sistemas Globales</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  width:800px;
  height:2040px;
  overflow:hidden;
  background:#000;
}
body{
  width:800px;
  height:2040px;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  width:800px;
  height:2040px;
  display:flex;
  flex-direction:column;
  background:#000;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}

/* ── HEADER ── */
.head{
  width:800px;
  height:200px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  border-bottom:2px solid #222;
  position:relative;
}
.head img{
  height:140px;
  width:auto;
  display:block;
  filter:brightness(0) invert(1);
}
.clock{
  text-align:right;
  line-height:1;
}
.clock .t{
  font-size:90px;
  font-weight:900;
  letter-spacing:-2px;
  display:block;
  white-space:nowrap;
  color:#fff;
}
.clock .ap{
  font-size:32px;
  font-weight:700;
  color:rgba(255,255,255,0.6);
  display:block;
  margin-top:4px;
}
.clock .d{
  font-size:26px;
  font-weight:500;
  color:rgba(255,255,255,0.45);
  display:block;
  margin-top:6px;
}
.tricolor{
  position:absolute;
  left:40px;right:40px;bottom:0;
  height:5px;
  background:linear-gradient(90deg,#5B9BFF 0 33.34%,#FF6A5E 33.34% 66.67%,#48D98A 66.67% 100%);
}

/* ── STAGE ── */
#stage{
  width:800px;
  height:1840px;
  position:relative;
  overflow:hidden;
}

/* ── PANELS ── */
.panel{
  position:absolute;
  top:0;left:0;
  width:800px;
  height:1840px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:40px;
  padding:60px 50px 100px;
  animation:entra .85s cubic-bezier(.2,.85,.2,1) both;
}
.panel.b{background:#0E2A63}
.panel.r{background:#8E1610}
.panel.g{background:#0A5730}
.glow{
  position:absolute;
  top:-20%;left:5%;
  width:90%;height:80%;
  pointer-events:none;
}
.panel.b .glow{background:radial-gradient(circle,rgba(91,155,255,.45) 0%,transparent 65%)}
.panel.r .glow{background:radial-gradient(circle,rgba(255,106,94,.4) 0%,transparent 65%)}
.panel.g .glow{background:radial-gradient(circle,rgba(72,217,138,.35) 0%,transparent 65%)}

.art{animation:icono 1s cubic-bezier(.2,.85,.2,1) .1s both}
.art>*{animation:flota 6.5s ease-in-out infinite}
.body{text-align:center;width:100%;animation:sube .9s cubic-bezier(.2,.85,.2,1) .18s both}

.kicker{
  font-size:44px;
  font-weight:700;
  letter-spacing:.18em;
  color:rgba(255,255,255,.75);
  margin-bottom:16px;
  text-transform:uppercase;
}
.rule{
  height:7px;
  border-radius:4px;
  width:180px;
  margin:28px auto;
}
.panel.b .rule{background:#5B9BFF}
.panel.r .rule{background:#FF6A5E}
.panel.g .rule{background:#48D98A}

.mega{
  font-size:210px;
  font-weight:900;
  letter-spacing:-5px;
  line-height:.9;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.note{
  font-size:44px;
  font-weight:500;
  line-height:1.2;
  margin-top:10px;
}

/* placa */
.plate{
  display:inline-block;
  position:relative;
  overflow:hidden;
  background:#fff;
  border-radius:24px;
  padding:14px 60px;
  margin-top:16px;
}
.plate i{
  position:absolute;top:0;bottom:0;width:26%;
  animation:barrido 3.4s ease-in-out infinite;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(142,22,16,.18) 50%,rgba(255,255,255,0));
}
.plate b{
  position:relative;
  display:block;
  font-size:210px;
  font-weight:900;
  color:#8E1610;
  letter-spacing:8px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.libre{
  display:inline-flex;
  align-items:center;
  gap:16px;
  background:#fff;
  border-radius:24px;
  padding:24px 60px;
  margin-top:16px;
  font-size:80px;
  font-weight:700;
  color:#0C6B33;
  line-height:1;
}

/* TRM */
.coin{
  width:280px;height:280px;
  border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:180px;font-weight:900;color:#0A5730;line-height:1;
}
.trm{
  font-size:150px;
  font-weight:900;
  letter-spacing:-4px;
  line-height:.92;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  margin-top:16px;
}
.chip{
  display:inline-flex;align-items:center;gap:16px;
  background:rgba(0,0,0,.3);
  border-radius:18px;
  padding:20px 40px;
  margin-top:16px;
}
.chip .a{font-size:46px;font-weight:700;line-height:1}
.chip .v{font-size:42px;font-weight:700;line-height:1.15;white-space:nowrap}

/* dots */
.dots{
  position:absolute;
  left:0;right:0;bottom:36px;
  display:flex;align-items:center;justify-content:center;
  gap:16px;pointer-events:none;z-index:10;
}
.dots i{
  height:14px;width:14px;
  border-radius:999px;background:#fff;
  opacity:.35;
  transition:width .5s,opacity .5s;
  display:inline-block;
}
.dots i.on{width:70px;opacity:1}

@keyframes entra{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes sube{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes icono{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes flota{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
@keyframes barrido{0%{transform:translateX(-130%)}100%{transform:translateX(420%)}}
</style>
</head>

    if(code===0||code===1) return SOL;
    if(code>=51) return LLUVIA;
    return SOL_NUBE;
  }
  function textoClima(code){
    if(code===0) return 'Cielo despejado';
    if(code<=2)  return 'Parcialmente nublado';
    if(code===3) return 'Nublado';
    if(code===45||code===48) return 'Neblina';
    if(code>=95) return 'Tormenta eléctrica';
    if(code>=80) return 'Chubascos';
    if(code>=51) return 'Lluvia';
    return 'Parcialmente nublado';
  }

  function panelClima(){
    var c=datos.clima;
    return '<div class="panel b"><div class="glow"></div>'+
      '<div class="art">'+(c?icoClima(c.weather_code,c.is_day===1):SOL_NUBE)+'</div>'+
      '<div class="body">'+
        '<div class="kicker">Clima en Cartagena</div>'+
        '<div class="mega">'+(c?Math.round(c.temperature_2m)+'°':'--°')+'</div>'+
        '<div class="rule"></div>'+
        '<div class="note">'+(c?textoClima(c.weather_code):'Cargando...')+'</div>'+
      '</div></div>';
  }

  function panelPYP(){
    var dig=PYP[new Date().getDay()];
    var caja=dig
      ?'<div class="plate"><i></i><b>'+dig+'</b></div>'
      :'<div class="libre">'+CHECK+' LIBRE</div>';
    return '<div class="panel r"><div class="glow"></div>'+
      '<div class="art">'+CARRO+'</div>'+
      '<div class="body">'+
        '<div class="kicker">Pico y Placa &middot; Cartagena</div>'+
        caja+
        '<div class="rule"></div>'+
        '<div class="note">'+(dig?'7:00–9:00 a.m. &nbsp;·&nbsp; 6:00–8:00 p.m.':'Circulación libre todo el día')+'</div>'+
      '</div></div>';
  }

  function panelTRM(){
    var t=datos.trm;
    var cuerpo=t
      ?'<div class="trm">$'+miles(t.valor,2)+'</div><div class="rule"></div>'+
        '<div class="chip"><span class="a">'+(t.variacion>=0?'▲':'▼')+'</span>'+
        '<span class="v">'+(t.variacion>=0?'+':'−')+miles(Math.abs(t.variacion),2)+
        ' ('+miles(Math.abs(t.variacionPct),2)+'%)</span></div>'
      :'<div class="trm">---</div><div class="rule"></div><div class="chip"><span class="v">Cargando...</span></div>';
    return '<div class="panel g"><div class="glow"></div>'+
      '<div class="art"><div class="coin">$</div></div>'+
      '<div class="body"><div class="kicker">Dólar HOY &middot; TRM Oficial</div>'+cuerpo+'</div></div>';
  }

  var PANELES=[panelClima,panelPYP,panelTRM];
  var idx=0;
  var stage=$('stage');
  var dots=[$('d0'),$('d1'),$('d2')];

  function pintar(){
    var prev=stage.querySelector('.panel');
    if(prev)prev.remove();
    stage.insertAdjacentHTML('afterbegin',PANELES[idx]());
    for(var n=0;n<3;n++) dots[n].className=(n===idx?'on':'');
  }
  function rotar(){idx=(idx+1)%PANELES.length;pintar();}
  pintar();
  setInterval(rotar,SEG*1000);

  function cargarClima(){
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code,is_day&timezone=America%2FBogota',{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(j){datos.clima=j.current;pintar();})
      .catch(function(){});
  }
  function cargarTRM(){
    fetch('https://www.datos.gov.co/resource/32sa-8pi3.json?$order=vigenciadesde%20DESC&$limit=2',{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(f){
        var v=parseFloat(f[0].valor),p=parseFloat(f[1].valor);
        datos.trm={valor:v,variacion:v-p,variacionPct:((v-p)/p)*100};
        pintar();
      }).catch(function(){});
  }

  cargarClima(); cargarTRM();
  setInterval(function(){cargarClima();cargarTRM();},REFRESCO*60000);
  setTimeout(function(){location.reload();},30*60000);
})();
</script>
</body>
</html>
